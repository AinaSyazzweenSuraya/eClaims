<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta th:replace="~{fragments/layout :: head('View & Download Pages')}" />
    <link rel="stylesheet" th:href="@{/css/view-page.css}">
</head>
<body class="layout-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">

    <div class="pdfsel-header">
        <div>
            <h1 class="pdfsel-title">Select Pages to Download</h1>
            <p class="pdfsel-subtitle">Choose which pages of the attachment you want to download</p>
        </div>
        <a th:href="@{/admin/claims}" class="pdfsel-back-btn">
            <i class="bi bi-arrow-left"></i> Back
        </a>
    </div>

    <div class="pdfsel-panel">
        <div class="pdfsel-toolbar">
            <div class="pdfsel-toolbar-title">
                <i class="bi bi-file-earmark-pdf"></i>
                <span>Attachment Pages</span>
                <span class="pdfsel-page-count" id="pageCountBadge"></span>
            </div>
            <div class="pdfsel-toolbar-actions">
                <button type="button" class="pdfsel-btn pdfsel-btn-ghost" onclick="selectAll()">
                    <i class="bi bi-check2-square"></i> Select All
                </button>
                <button type="button" class="pdfsel-btn pdfsel-btn-ghost" onclick="deselectAll()">
                    <i class="bi bi-square"></i> Deselect All
                </button>
                <button type="button" class="pdfsel-btn pdfsel-btn-primary" id="downloadBtn" onclick="downloadSelected()" disabled>
                    <i class="bi bi-download"></i> Download Selected (<span id="selectedCount">0</span>)
                </button>
            </div>
        </div>

        <p class="pdfsel-hint"><i class="bi bi-info-circle"></i> Click a page to preview it full-size. Use the checkbox in the corner to select it for download.</p>

        <div id="pdfPagesContainer" class="pdfsel-grid">
            <div class="pdfsel-loading" id="loadingMsg">
                <div class="pdfsel-spinner"></div>
                <span>Loading pages...</span>
            </div>
        </div>
    </div>
</main>

<!-- Zoom / preview modal -->
<div id="pdfZoomOverlay" class="pdfsel-zoom-overlay" onclick="closeZoomOnBackdrop(event)">
    <div class="pdfsel-zoom-modal">
        <div class="pdfsel-zoom-header">
            <span id="pdfZoomLabel">Page 1</span>
            <button type="button" class="pdfsel-zoom-close" onclick="closeZoom()">&times;</button>
        </div>
        <div class="pdfsel-zoom-body" id="pdfZoomBody">
            <button type="button" class="pdfsel-zoom-nav" onclick="zoomNav(-1)">&#8249;</button>
            <div class="pdfsel-zoom-canvas-wrap" id="pdfZoomCanvasWrap">
                <canvas id="pdfZoomCanvas"></canvas>
            </div>
            <button type="button" class="pdfsel-zoom-nav" onclick="zoomNav(1)">&#8250;</button>
        </div>
        <div class="pdfsel-zoom-footer">
            <label class="pdfsel-zoom-select-label">
                <input type="checkbox" id="pdfZoomCheckbox" onchange="toggleFromZoom(this)">
                Select this page for download
            </label>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script th:inline="javascript">
    const workflowId = /*[[${workflowId}]]*/ 0;
    const pdfUrl = /*[[@{/claims/pdf/{id}(id=${workflowId})}]]*/ '';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const selectedPages = new Set();
    let pdfDoc = null;
    let currentZoomPage = 1;
    let zoomLevel = 1.0; // 1.0 = base "fit" render, adjustable via +/- buttons

    function updateDownloadButton() {
        document.getElementById('selectedCount').textContent = selectedPages.size;
        document.getElementById('downloadBtn').disabled = selectedPages.size === 0;
    }

    function setCardSelected(pageNum, isSelected) {
        const card = document.querySelector(`.pdfsel-card[data-page="${pageNum}"]`);
        if (card) card.classList.toggle('selected', isSelected);
    }

    function togglePage(pageNum, checkboxEl) {
        checkboxEl.checked ? selectedPages.add(pageNum) : selectedPages.delete(pageNum);
        setCardSelected(pageNum, checkboxEl.checked);
        updateDownloadButton();
    }

    function selectAll() {
        document.querySelectorAll('.page-checkbox').forEach(cb => {
            cb.checked = true;
            selectedPages.add(parseInt(cb.dataset.page));
            setCardSelected(parseInt(cb.dataset.page), true);
        });
        updateDownloadButton();
    }

    function deselectAll() {
        document.querySelectorAll('.page-checkbox').forEach(cb => {
            cb.checked = false;
            setCardSelected(parseInt(cb.dataset.page), false);
        });
        selectedPages.clear();
        updateDownloadButton();
    }

    function downloadSelected() {
        if (selectedPages.size === 0) return;
        const pages = Array.from(selectedPages).sort((a, b) => a - b).join(',');
        window.location.href = `/claims/pdf/${workflowId}/pages?pages=${pages}`;
    }

    async function renderPdfThumbnails() {
        const container = document.getElementById('pdfPagesContainer');
        try {
            pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
            document.getElementById('loadingMsg').remove();
            document.getElementById('pageCountBadge').textContent = `${pdfDoc.numPages} pages`;

            // Step 1: render every page and crop to its actual content
            const croppedPages = [];
            for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.0 });

                const fullCanvas = document.createElement('canvas');
                fullCanvas.width = viewport.width;
                fullCanvas.height = viewport.height;
                const fullCtx = fullCanvas.getContext('2d');
                await page.render({ canvasContext: fullCtx, viewport }).promise;

                const bbox = getContentBoundingBox(fullCanvas, fullCtx);
                const margin = 12;
                const cropX = Math.max(0, bbox.minX - margin);
                const cropY = Math.max(0, bbox.minY - margin);
                const cropW = Math.min(fullCanvas.width - cropX, bbox.maxX - bbox.minX + margin * 2);
                const cropH = Math.min(fullCanvas.height - cropY, bbox.maxY - bbox.minY + margin * 2);

                croppedPages.push({ pageNum, fullCanvas, cropX, cropY, cropW, cropH });
            }

            // Step 2: build one tall canvas stacking all cropped strips
            const gap = 20; // visual breathing room + divider between pages
            const stitchWidth = Math.max(...croppedPages.map(p => p.cropW));
            const stitchHeight = croppedPages.reduce((sum, p) => sum + p.cropH, 0) + gap * (croppedPages.length - 1);

            const stitchCanvas = document.createElement('canvas');
            stitchCanvas.width = stitchWidth;
            stitchCanvas.height = stitchHeight;
            const stitchCtx = stitchCanvas.getContext('2d');
            stitchCtx.fillStyle = '#ffffff';
            stitchCtx.fillRect(0, 0, stitchWidth, stitchHeight);

            const pageBoundaries = [];
            let yOffset = 0;
            for (const p of croppedPages) {
                stitchCtx.drawImage(
                    p.fullCanvas,
                    p.cropX, p.cropY, p.cropW, p.cropH,
                    0, yOffset, p.cropW, p.cropH
                );
                pageBoundaries.push({ pageNum: p.pageNum, yStart: yOffset, yEnd: yOffset + p.cropH });

                yOffset += p.cropH;
                if (p !== croppedPages[croppedPages.length - 1]) {
                    // draw a subtle divider line in the gap
                    stitchCtx.strokeStyle = '#e2e8f0';
                    stitchCtx.lineWidth = 1;
                    stitchCtx.beginPath();
                    stitchCtx.moveTo(0, yOffset + gap / 2);
                    stitchCtx.lineTo(stitchWidth, yOffset + gap / 2);
                    stitchCtx.stroke();
                    yOffset += gap;
                }
            }

            // Step 3: render the single stitched canvas + per-page checkboxes overlaid at boundaries
            const wrap = document.createElement('div');
            wrap.className = 'pdfsel-stitched-wrap';
            wrap.style.position = 'relative';
            wrap.appendChild(stitchCanvas);

            // Overlay a checkbox + label at the top-left of each page's region
            for (const b of pageBoundaries) {
                const overlay = document.createElement('div');
                overlay.className = 'pdfsel-stitch-page-overlay';
                overlay.style.position = 'absolute';
                overlay.style.top = `${b.yStart + 8}px`;
                overlay.style.left = '8px';
                overlay.innerHTML = `
                <label class="pdfsel-stitch-label">
                    <input type="checkbox" class="page-checkbox" data-page="${b.pageNum}"
                           onchange="togglePage(${b.pageNum}, this)">
                    Page ${b.pageNum}
                </label>
            `;
                wrap.appendChild(overlay);
            }

            container.innerHTML = '';
            container.appendChild(wrap);

        } catch (err) {
            container.innerHTML = '<p style="color:#f87171;grid-column:1/-1;">Failed to load PDF preview.</p>';
            console.error(err);
        }
    }

    function getContentBoundingBox(canvas, ctx) {
        const { width, height } = canvas;
        const data = ctx.getImageData(0, 0, width, height).data;
        const whiteThreshold = 250;
        let minX = width, minY = height, maxX = 0, maxY = 0;
        let found = false;
        const step = 2;

        for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
                const i = (y * width + x) * 4;
                const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                const isBackground = a === 0 || (r > whiteThreshold && g > whiteThreshold && b > whiteThreshold);
                if (!isBackground) {
                    found = true;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (!found) return { minX: 0, minY: 0, maxX: width, maxY: height };
        return { minX, minY, maxX, maxY };
    }

    // Scans pixel data to find the rectangle enclosing all non-white/non-transparent content
    function getContentBoundingBox(canvas, ctx) {
        const { width, height } = canvas;
        const data = ctx.getImageData(0, 0, width, height).data;
        const whiteThreshold = 250; // treat near-white as background
        let minX = width, minY = height, maxX = 0, maxY = 0;
        let found = false;

        // Sample every 2px for speed on large pages
        const step = 2;
        for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
                const i = (y * width + x) * 4;
                const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                const isBackground = a === 0 || (r > whiteThreshold && g > whiteThreshold && b > whiteThreshold);
                if (!isBackground) {
                    found = true;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                }
            }
        }

        if (!found) {
            // Fallback: whole page has no detectable content, return full canvas
            return { minX: 0, minY: 0, maxX: width, maxY: height };
        }
        return { minX, minY, maxX, maxY };
    }

    async function renderZoomPage(pageNum) {
        const page = await pdfDoc.getPage(pageNum);
        const dpr = window.devicePixelRatio || 1;

        const nativeViewport = page.getViewport({ scale: 1 });
        const pageAspectRatio = nativeViewport.height / nativeViewport.width; // actual PDF page ratio

        const wrap = document.getElementById('pdfZoomCanvasWrap');
        const availableWidth = wrap.clientWidth;
        const availableHeight = wrap.clientHeight;

        // Fit the page's real proportions within available space, capped so it never exceeds it
        let displayWidth = availableWidth;
        let displayHeight = displayWidth * pageAspectRatio;

        if (displayHeight > availableHeight) {
            displayHeight = availableHeight;
            displayWidth = displayHeight / pageAspectRatio;
        }

        // Render at higher pixel density for sharpness, independent of display size
        const pixelWidth = displayWidth * dpr * 2; // 2x oversample
        const renderScale = pixelWidth / nativeViewport.width;

        const viewport = page.getViewport({ scale: renderScale });
        const canvas = document.getElementById('pdfZoomCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = displayWidth + 'px';
        canvas.style.height = displayHeight + 'px';

        await page.render({ canvasContext: ctx, viewport }).promise;

        document.getElementById('pdfZoomLabel').textContent = `Page ${pageNum} of ${pdfDoc.numPages}`;
        document.getElementById('pdfZoomCheckbox').checked = selectedPages.has(pageNum);
    }

    function openZoom(pageNum) {
        currentZoomPage = pageNum;
        zoomLevel = 1.0; // reset zoom each time a new page is opened
        document.getElementById('pdfZoomOverlay').classList.add('active');
        renderZoomPage(pageNum);
    }

    function zoomNav(delta) {
        const next = currentZoomPage + delta;
        if (next < 1 || next > pdfDoc.numPages) return;
        currentZoomPage = next;
        zoomLevel = 1.0; // reset zoom on page navigation too
        renderZoomPage(currentZoomPage);
    }

    function closeZoom() {
        document.getElementById('pdfZoomOverlay').classList.remove('active');
    }

    function closeZoomOnBackdrop(e) {
        if (e.target.id === 'pdfZoomOverlay') closeZoom();
    }

    function toggleFromZoom(checkboxEl) {
        const gridCheckbox = document.querySelector(`.page-checkbox[data-page="${currentZoomPage}"]`);
        if (gridCheckbox) {
            gridCheckbox.checked = checkboxEl.checked;
            togglePage(currentZoomPage, gridCheckbox);
        }
    }

    document.addEventListener('keydown', (e) => {
        if (!document.getElementById('pdfZoomOverlay').classList.contains('active')) return;
        if (e.key === 'Escape') closeZoom();
        if (e.key === 'ArrowLeft') zoomNav(-1);
        if (e.key === 'ArrowRight') zoomNav(1);
    });

    renderPdfThumbnails();
</script>
</body>
</html>
