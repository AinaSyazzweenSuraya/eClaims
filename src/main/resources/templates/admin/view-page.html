<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta th:replace="~{fragments/layout :: head('View & Download Pages')}" />
    <link rel="stylesheet" th:href="@{/css/view-page.css}">
</head>
<body class="layout-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>

<main class="main-content">
    <div class="pdfsel-app">

        <!-- ===== Top bar: back + title on the left, everything you need on the right ===== -->
        <header class="pdfsel-top">
            <div class="pdfsel-heading">
                <a th:href="@{/admin/claims}" class="pdfsel-back-btn" title="Back to claims">
                    <i class="bi bi-arrow-left"></i><span>Back</span>
                </a>
                <div class="pdfsel-heading-text">
                    <h1 class="pdfsel-title">Download pages</h1>
                    <p class="pdfsel-subtitle" id="subtitle">Preparing your pages…</p>
                </div>
            </div>

            <div class="pdfsel-actions">
                <div class="pdfsel-zoom-group" role="group" aria-label="Zoom">
                    <button type="button" class="pdfsel-icon-btn" id="zoomOut" title="Zoom out ( - )" aria-label="Zoom out">
                        <i class="bi bi-dash-lg"></i>
                    </button>
                    <span class="pdfsel-zoom-label" id="zoomLabel" aria-live="polite">100%</span>
                    <button type="button" class="pdfsel-icon-btn" id="zoomIn" title="Zoom in ( + )" aria-label="Zoom in">
                        <i class="bi bi-plus-lg"></i>
                    </button>
                    <button type="button" class="pdfsel-icon-btn pdfsel-fit-btn" id="zoomFit" title="Fit to screen ( 0 )" aria-label="Fit to screen">
                        <i class="bi bi-arrows-angle-contract"></i>
                    </button>
                </div>

                <button type="button" class="pdfsel-btn pdfsel-btn-ghost" id="selectToggle" disabled>
                    <i class="bi bi-check2-all"></i><span id="selectToggleLabel">Select all</span>
                </button>

                <button type="button" class="pdfsel-btn pdfsel-btn-primary" id="downloadBtn" disabled>
                    <i class="bi bi-download"></i>
                    <span>Download</span>
                    <span class="pdfsel-count" id="selectedCount">0</span>
                </button>
            </div>
        </header>

        <!-- ===== Viewer: all filled pages merged into one sheet that fits the screen ===== -->
        <section class="pdfsel-stage" id="stage" aria-label="Page preview">
            <div class="pdfsel-loading" id="loadingMsg">
                <div class="pdfsel-spinner"></div>
                <span id="loadingText">Loading pages…</span>
            </div>
            <div class="pdfsel-sheet" id="sheet" hidden></div>
        </section>

        <!-- ===== Status bar ===== -->
        <footer class="pdfsel-status">
            <span class="pdfsel-hint">
                <i class="bi bi-info-circle"></i>
                Click a section to select or unselect it. Ctrl + scroll to zoom. Drag to move around when zoomed in.
            </span>

            <label class="pdfsel-switch" id="emptyToggleWrap" hidden>
                <input type="checkbox" id="showEmpty">
                <span class="pdfsel-switch-track"></span>
                <span id="emptyToggleLabel">Show empty pages</span>
            </label>
        </footer>
    </div>
</main>

<div class="pdfsel-toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script th:inline="javascript">
    (() => {
        /* ---------- Config from server ---------- */
        const workflowId  = /*[[${workflowId}]]*/ 0;
        const pdfUrl      = /*[[@{/claims/pdf/{id}(id=${workflowId})}]]*/ '';
        const downloadUrl = /*[[@{/claims/pdf/{id}/pages(id=${workflowId})}]]*/ '';

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        /* ---------- Tunables ---------- */
        const RENDER_SCALE = Math.min(3, Math.max(2, (window.devicePixelRatio || 1) * 1.5)); // crispness
        const CROP_MARGIN  = 12;    // px (at scale 1) kept around the content of each page
        const MIN_ZOOM     = 0.2;
        const MAX_ZOOM     = 4;
        const MAX_FIT      = 3;     // don't blow a tiny page up beyond 300% when fitting
        const ZOOM_STEP    = 1.25;

        /* ---------- State ---------- */
        const pages = [];                 // { num, canvas, w, h, empty, el }
        const selected = new Set();
        let showEmpty = false;
        let fitMode = true;
        let zoom = 1;

        /* ---------- Elements ---------- */
        const $ = id => document.getElementById(id);
        const stage = $('stage'), sheet = $('sheet');
        const downloadBtn = $('downloadBtn'), selectToggle = $('selectToggle');

        /* =====================================================================
           Loading + preparing pages
           ===================================================================== */
        async function init() {
            try {
                const pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;

                for (let n = 1; n <= pdfDoc.numPages; n++) {
                    $('loadingText').textContent = `Preparing page ${n} of ${pdfDoc.numPages}…`;
                    pages.push(await preparePage(pdfDoc, n));
                }

                // If every page looks empty, show them all rather than an empty screen
                if (pages.every(p => p.empty)) pages.forEach(p => p.empty = false);

                pages.forEach(buildSection);

                // Default: every page the user filled in is already selected
                pages.filter(p => !p.empty).forEach(p => selected.add(p.num));

                $('loadingMsg').remove();
                sheet.hidden = false;
                renderSheet();
            } catch (err) {
                console.error(err);
                $('loadingMsg').innerHTML =
                    '<i class="bi bi-exclamation-triangle pdfsel-error-icon"></i>' +
                    '<span>We couldn\'t load this attachment.</span>' +
                    '<button type="button" class="pdfsel-btn pdfsel-btn-ghost" onclick="location.reload()">' +
                    '<i class="bi bi-arrow-clockwise"></i> Try again</button>';
            }
        }

        // Renders one page, crops it to its content, and works out whether the user filled it in
        async function preparePage(pdfDoc, num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: RENDER_SCALE });

            const full = document.createElement('canvas');
            full.width = Math.ceil(viewport.width);
            full.height = Math.ceil(viewport.height);
            const fullCtx = full.getContext('2d', { willReadFrequently: true });
            await page.render({ canvasContext: fullCtx, viewport }).promise;

            const bbox = getContentBoundingBox(full, fullCtx);
            const emptyByText = await hasOnlyZeroAmounts(page);
            const empty = !bbox || emptyByText;

            const m = CROP_MARGIN * RENDER_SCALE;
            const box = bbox || { minX: 0, minY: 0, maxX: full.width, maxY: full.height };
            const cropX = Math.max(0, Math.floor(box.minX - m));
            const cropY = Math.max(0, Math.floor(box.minY - m));
            const cropW = Math.min(full.width - cropX, Math.ceil(box.maxX - box.minX + m * 2));
            const cropH = Math.min(full.height - cropY, Math.ceil(box.maxY - box.minY + m * 2));

            const canvas = document.createElement('canvas');
            canvas.width = cropW;
            canvas.height = cropH;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cropW, cropH);
            ctx.drawImage(full, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

            // natural (CSS px at 100%) size of the cropped page
            return { num, canvas, w: cropW / RENDER_SCALE, h: cropH / RENDER_SCALE, empty, el: null };
        }

        // A page counts as "not filled in" when it has amounts and every one of them is 0.00
        async function hasOnlyZeroAmounts(page) {
            try {
                const content = await page.getTextContent();
                const text = content.items.map(i => i.str).join(' ');
                const amounts = text.match(/\d[\d,]*\.\d{2}\b/g) || [];
                if (amounts.length === 0) return false;           // can't tell, so keep the page
                return amounts.every(a => parseFloat(a.replace(/,/g, '')) === 0);
            } catch (e) {
                return false;
            }
        }

        // Finds the rectangle that encloses all non-white, non-transparent pixels
        function getContentBoundingBox(canvas, ctx) {
            const { width, height } = canvas;
            const data = ctx.getImageData(0, 0, width, height).data;
            const whiteThreshold = 250;
            const step = 3;
            let minX = width, minY = height, maxX = 0, maxY = 0, found = false;

            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const i = (y * width + x) * 4;
                    const a = data[i + 3];
                    const isBackground = a === 0 ||
                        (data[i] > whiteThreshold && data[i + 1] > whiteThreshold && data[i + 2] > whiteThreshold);
                    if (!isBackground) {
                        found = true;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }
            return found ? { minX, minY, maxX, maxY } : null;
        }

        /* =====================================================================
           Building the merged sheet
           ===================================================================== */
        function buildSection(p) {
            const el = document.createElement('div');
            el.className = 'pdfsel-section';
            el.tabIndex = 0;
            el.setAttribute('role', 'checkbox');
            el.setAttribute('aria-checked', 'false');
            el.setAttribute('aria-label', `Page ${p.num}`);
            el.dataset.page = p.num;

            p.canvas.style.width = `calc(${p.w}px * var(--z, 1))`;
            p.canvas.style.height = 'auto';
            el.appendChild(p.canvas);

            const badge = document.createElement('span');
            badge.className = 'pdfsel-badge';
            badge.innerHTML = `<span class="pdfsel-badge-box"><i class="bi bi-check-lg"></i></span><span>Page ${p.num}</span>`;
            el.appendChild(badge);

            if (p.empty) {
                const tag = document.createElement('span');
                tag.className = 'pdfsel-empty-tag';
                tag.textContent = 'Nothing filled in';
                el.appendChild(tag);
            }

            el.addEventListener('click', () => toggle(p.num));
            el.addEventListener('keydown', e => {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(p.num); }
            });
            p.el = el;
        }

        const visiblePages = () => pages.filter(p => showEmpty || !p.empty);

        function renderSheet() {
            sheet.replaceChildren(...visiblePages().map(p => p.el));
            updateSelectionUI();
            updateStatus();
            applyZoom();
        }

        /* =====================================================================
           Selection
           ===================================================================== */
        function toggle(num) {
            selected.has(num) ? selected.delete(num) : selected.add(num);
            updateSelectionUI();
        }

        function updateSelectionUI() {
            const vis = visiblePages();
            pages.forEach(p => {
                const on = selected.has(p.num);
                p.el.classList.toggle('selected', on);
                p.el.setAttribute('aria-checked', on);
            });

            const count = selected.size;
            $('selectedCount').textContent = count;
            downloadBtn.disabled = count === 0;
            downloadBtn.title = count ? `Download ${count} page${count === 1 ? '' : 's'} as PDF` : 'Select at least one page';

            const allOn = vis.length > 0 && vis.every(p => selected.has(p.num));
            selectToggle.disabled = vis.length === 0;
            $('selectToggleLabel').textContent = allOn ? 'Clear selection' : 'Select all';
            selectToggle.querySelector('i').className = allOn ? 'bi bi-x-lg' : 'bi bi-check2-all';
        }

        selectToggle.addEventListener('click', () => {
            const vis = visiblePages();
            const allOn = vis.every(p => selected.has(p.num));
            vis.forEach(p => allOn ? selected.delete(p.num) : selected.add(p.num));
            updateSelectionUI();
        });

        function updateStatus() {
            const emptyCount = pages.filter(p => p.empty).length;
            const total = pages.length;
            const shown = visiblePages().length;

            $('subtitle').textContent = (emptyCount && !showEmpty)
                ? `Showing ${shown} of ${total} pages. ${emptyCount} with nothing filled in ${emptyCount === 1 ? 'is' : 'are'} hidden.`
                : `${total} page${total === 1 ? '' : 's'} in this attachment.`;

            const wrap = $('emptyToggleWrap');
            wrap.hidden = emptyCount === 0;
            $('emptyToggleLabel').textContent =
                `Show ${emptyCount} empty page${emptyCount === 1 ? '' : 's'}`;
        }

        $('showEmpty').addEventListener('change', e => {
            showEmpty = e.target.checked;
            if (!showEmpty) pages.filter(p => p.empty).forEach(p => selected.delete(p.num)); // no hidden downloads
            renderSheet();
        });

        /* =====================================================================
           Download
           ===================================================================== */
        downloadBtn.addEventListener('click', () => {
            if (selected.size === 0) return;
            const list = Array.from(selected).sort((a, b) => a - b);
            showToast(`Downloading ${list.length} page${list.length === 1 ? '' : 's'}…`);
            window.location.href = `${downloadUrl}?pages=${list.join(',')}`;
        });

        let toastTimer;
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        /* =====================================================================
           Zoom
           ===================================================================== */
        function computeFit() {
            const vis = visiblePages();
            if (!vis.length) return 1;
            const cs = getComputedStyle(stage);
            const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
            const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
            const maxW = Math.max(...vis.map(p => p.w));
            const sumH = vis.reduce((s, p) => s + p.h, 0);
            const dividers = vis.length;                       // 1px divider per section
            const fit = Math.min(availW / maxW, (availH - dividers) / sumH, MAX_FIT);
            return Math.max(MIN_ZOOM, Math.floor(fit * 1000) / 1000);
        }

        function applyZoom() {
            if (fitMode) zoom = computeFit();
            sheet.style.setProperty('--z', zoom);
            $('zoomLabel').textContent = Math.round(zoom * 100) + '%';
            $('zoomFit').classList.toggle('active', fitMode);
            requestAnimationFrame(() => {
                const scrollable = stage.scrollWidth > stage.clientWidth + 1 || stage.scrollHeight > stage.clientHeight + 1;
                stage.classList.toggle('can-pan', scrollable);
            });
        }

        function setZoom(next) {
            next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, next));
            // keep whatever is in the middle of the view in the middle
            const cx = (stage.scrollLeft + stage.clientWidth / 2) / (stage.scrollWidth || 1);
            const cy = (stage.scrollTop + stage.clientHeight / 2) / (stage.scrollHeight || 1);
            fitMode = false;
            zoom = next;
            applyZoom();
            stage.scrollLeft = cx * stage.scrollWidth - stage.clientWidth / 2;
            stage.scrollTop  = cy * stage.scrollHeight - stage.clientHeight / 2;
        }

        function fitToScreen() { fitMode = true; applyZoom(); stage.scrollTo(0, 0); }

        $('zoomIn').addEventListener('click',  () => setZoom(zoom * ZOOM_STEP));
        $('zoomOut').addEventListener('click', () => setZoom(zoom / ZOOM_STEP));
        $('zoomFit').addEventListener('click', fitToScreen);
        $('zoomLabel').addEventListener('dblclick', fitToScreen);

        // Ctrl/Cmd + scroll (and trackpad pinch) zooms the sheet instead of the whole browser page
        stage.addEventListener('wheel', e => {
            if (!(e.ctrlKey || e.metaKey)) return;
            e.preventDefault();
            setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
        }, { passive: false });

        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
            if (e.key === '+' || e.key === '=') setZoom(zoom * ZOOM_STEP);
            else if (e.key === '-' || e.key === '_') setZoom(zoom / ZOOM_STEP);
            else if (e.key === '0') fitToScreen();
        });

        window.addEventListener('resize', () => { if (fitMode) applyZoom(); });

        /* ---------- Drag to move around when zoomed in ---------- */
        let drag = null, dragged = false;
        stage.addEventListener('mousedown', e => {
            if (e.button !== 0 || !stage.classList.contains('can-pan')) return;
            drag = { x: e.clientX, y: e.clientY, left: stage.scrollLeft, top: stage.scrollTop };
            dragged = false;
        });
        window.addEventListener('mousemove', e => {
            if (!drag) return;
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            if (!dragged && Math.hypot(dx, dy) < 5) return;
            dragged = true;
            stage.classList.add('is-panning');
            stage.scrollLeft = drag.left - dx;
            stage.scrollTop  = drag.top - dy;
        });
        window.addEventListener('mouseup', () => {
            drag = null;
            stage.classList.remove('is-panning');
        });
        // A drag must not count as a click that toggles a page
        stage.addEventListener('click', e => {
            if (dragged) { e.stopPropagation(); e.preventDefault(); dragged = false; }
        }, true);

        init();
    })();
</script>
</body>
</html>
