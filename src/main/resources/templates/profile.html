<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body class="layout-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
  <div class="page-header"><div><h1 class="page-title">My Profile</h1><p class="page-sub">Account information and password</p></div></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start">
    <div class="card-panel" style="padding:1.5rem">
      <h2 style="font-size:.95rem;font-weight:700;margin-bottom:1.25rem">Staff Information</h2>
      <div style="display:grid;gap:.75rem">
        <div><label class="form-label-sm">Staff ID</label><div class="mono fw-600" th:text="${staff.staffId}">—</div></div>
        <div><label class="form-label-sm">Full Name</label><div th:text="${staff.name}">—</div></div>
        <div><label class="form-label-sm">Designation</label><div th:text="${staff.designation}">—</div></div>
        <div><label class="form-label-sm">Department</label><div th:text="${staff.departmentName}">—</div></div>
        <div><label class="form-label-sm">Company</label><div th:text="${staff.companyName}">—</div></div>
        <div><label class="form-label-sm">Email</label><div th:text="${staff.email}">—</div></div>
        <div><label class="form-label-sm">Role</label>
          <span class="status-badge status-submitted" th:text="${account != null ? account.role : '—'}">—</span>
        </div>
      </div>
    </div>
    <div class="card-panel" style="padding:1.5rem">
      <h2 style="font-size:.95rem;font-weight:700;margin-bottom:1.25rem">Change Password</h2>
      <div th:if="${pwdSuccess}" class="alert-banner success" th:text="${pwdSuccess}"></div>
      <div th:if="${pwdError}"   class="alert-banner danger"  th:text="${pwdError}"></div>
      <form th:action="@{/profile/change-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div style="margin-bottom:.85rem"><label class="form-label-sm">Current Password</label>
          <input type="password" name="oldPassword" class="form-input" required placeholder="Current password"/></div>
        <div style="margin-bottom:.85rem"><label class="form-label-sm">New Password</label>
          <input type="password" name="newPassword" class="form-input" required minlength="8" placeholder="Min. 8 characters"/></div>
        <div style="margin-bottom:1.25rem"><label class="form-label-sm">Confirm New Password</label>
          <input type="password" name="confirmPassword" class="form-input" required placeholder="Repeat new password"/></div>
        <button type="submit" class="btn-approve"><i class="bi bi-key me-1"></i> Update Password</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
