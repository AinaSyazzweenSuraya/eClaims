<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('My Profile')}"></head>
<body class="layout-body">
<div th:replace="~{fragments/layout :: sidebar}"></div>
<main class="main-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">My Profile</h1>
      <p class="page-sub">Account information and password</p>
    </div>
  </div>

  <div class="profile-grid">

    <!-- Staff Information -->
    <div class="card-panel">
      <div class="profile-card-header">
        <div class="profile-avatar-lg" th:text="${#strings.substring(staff.name,0,1)}">A</div>
        <div class="profile-name-block">
          <div class="profile-name" th:text="${staff.name}">—</div>
          <div class="profile-role-line">
            <span class="profile-designation" th:text="${staff.designation}">—</span>
            <span class="status-badge status-submitted" th:text="${account != null ? account.role : '—'}">—</span>
          </div>
        </div>
      </div>

      <div class="profile-card-body">
        <div class="profile-info-list">

          <div class="profile-info-row">
            <div class="profile-info-icon"><i class="bi bi-person fill"></i></div>
            <div class="profile-info-text">
              <label class="form-label-sm">Staff ID</label>
              <div class="profile-info-value mono" th:text="${staff.staffId}">—</div>
            </div>
          </div>

          <div class="profile-info-row">
            <div class="profile-info-icon"><i class="bi bi-diagram-3"></i></div>
            <div class="profile-info-text">
              <label class="form-label-sm">Department</label>
              <div class="profile-info-value" th:text="${staff.departmentName}">—</div>
            </div>
          </div>

          <div class="profile-info-row">
            <div class="profile-info-icon"><i class="bi bi-building"></i></div>
            <div class="profile-info-text">
              <label class="form-label-sm">Company</label>
              <div class="profile-info-value" th:text="${staff.companyName}">—</div>
            </div>
          </div>

          <div class="profile-info-row">
            <div class="profile-info-icon"><i class="bi bi-envelope"></i></div>
            <div class="profile-info-text">
              <label class="form-label-sm">Email</label>
              <div class="profile-info-value" th:text="${staff.email}">—</div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Change Password -->
    <div class="card-panel">
      <div class="card-panel-header">
        <span class="card-panel-title"><i class="bi bi-shield-lock me-1"></i> Change Password</span>
      </div>
      <div class="profile-card-body">
        <p class="profile-pwd-intro">Use at least 8 characters. We recommend mixing letters, numbers, and symbols to keep your account secure.</p>

        <div th:if="${pwdSuccess}" class="alert-banner success" th:text="${pwdSuccess}"></div>
        <div th:if="${pwdError}"   class="alert-banner danger"  th:text="${pwdError}"></div>

        <form th:action="@{/profile/change-password}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div style="margin-bottom:.85rem">
            <label class="form-label-sm">Current Password</label>
            <input type="password" name="oldPassword" class="form-input" required placeholder="Current password"/>
          </div>
          <div style="margin-bottom:.85rem">
            <label class="form-label-sm">New Password</label>
            <input type="password" name="newPassword" class="form-input" required minlength="8" placeholder="Min. 8 characters"/>
          </div>
          <div style="margin-bottom:1.25rem">
            <label class="form-label-sm">Confirm New Password</label>
            <input type="password" name="confirmPassword" class="form-input" required placeholder="Repeat new password"/>
          </div>

          <button type="submit" class="btn-approve profile-submit"><i class="bi bi-key me-1"></i> Update Password</button>
        </form>
      </div>
    </div>

  </div>
</main>
</body>
</html>
