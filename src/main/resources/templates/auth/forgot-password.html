<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <title>Forgot Password — IFC E-Claims</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
          rel="stylesheet"/>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #f1f5f9;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,.1);
        }

        .icon {
            width: 52px;
            height: 52px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .sub {
            font-size: .875rem;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            font-size: .8rem;
            font-weight: 600;
            color: #374151;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: .875rem;
            font-family: inherit;
            color: #0f172a;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.1);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #2563eb;
            font-size: .8rem;
            font-weight: 600;
            text-decoration: none;
        }

        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: .85rem;
            margin-bottom: 18px;
        }

        .alert-success {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: .85rem;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        <i class="bi bi-key"></i>
    </div>

    <div class="title">Forgot Password?</div>

    <p class="sub">
        Enter your Staff ID and we will send you a link
        to reset your password.
    </p>

    <!-- Error Message -->
    <div th:if="${errorMessage}" class="alert-error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- Success Message -->
    <div th:if="${successMessage}" class="alert-success">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/forgot-password}" method="post">

        <div class="form-group">
            <label for="staffId">Staff ID</label>

            <input type="text"
                   id="staffId"
                   name="staffId"
                   placeholder="e.g. INFO307"
                   required/>
        </div>

        <button type="submit" class="btn-submit">
            <i class="bi bi-envelope me-1"></i>
            Send Reset Link
        </button>

    </form>

    <div class="back-login">
        <a th:href="@{/login}">
            <i class="bi bi-arrow-left"></i>
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
